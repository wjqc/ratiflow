stages:
  - validate
  - test
  - build
  - e2e
  - package

default:
  interruptible: true

variables:
  GOPROXY: https://goproxy.cn,direct

rust-validate:
  stage: validate
  image: rust:1.95
  before_script:
    - rustup component add rustfmt clippy
    - cargo --version
  script:
    - cargo fmt --all -- --check
    - cargo clippy --all-targets -- -D warnings

ts-validate:
  stage: validate
  image: node:26
  variables:
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  script:
    - npm ci
    - npm run codegen:protocol
    - npm run typecheck

rust-test:
  stage: test
  image: rust:1.95
  script:
    - cargo test --all

web-test:
  stage: test
  image: node:26
  variables:
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  script:
    - npm ci
    - npm run test

contract-test:
  stage: test
  image: node:26
  variables:
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  script:
    - npm ci
    - node tests/contract/run.mjs

build:
  stage: build
  image: node:26
  variables:
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  script:
    - npm ci
    - npm run build:core
    - npm run build:desktop
  artifacts:
    expire_in: 7 days
    paths:
      - target/release/sixgates-core
      - apps/desktop/dist/

protocol-e2e:
  stage: e2e
  image: node:26
  needs: [build]
  script:
    - node tests/e2e-protocol/e2e.mjs
    - node tests/e2e-protocol/agent-e2e.mjs
    - node tests/e2e-protocol/settings-e2e.mjs
    - node tests/e2e-protocol/trace-e2e.mjs
    - node tests/e2e-protocol/gate-release-race-e2e.mjs
    - node tests/e2e-protocol/rollback-e2e.mjs
    - node tests/e2e-protocol/agent-routing-e2e.mjs
    - node tests/e2e-protocol/memory-e2e.mjs
    - node tests/e2e-protocol/rpc-receipt-e2e.mjs
    - node tests/e2e-protocol/risk-ledger-e2e.mjs
    - node tests/e2e-protocol/mcp-platform-e2e.mjs

electron-e2e:
  stage: e2e
  image: node:26
  needs: [build]
  variables:
    ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    PLAYWRIGHT_DOWNLOAD_HOST: https://npmmirror.com/mirrors/playwright
  script:
    - npm ci
    - apt-get update && apt-get install -y xvfb libgtk-3-0 libasound2
    - npm --workspace @sixgates/desktop run build
    - cd apps/desktop && xvfb-run npx playwright test
  tags: [docker]

package:
  stage: package
  image: node:26
  needs: [protocol-e2e]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - npm --workspace @sixgates/desktop run package
  artifacts:
    expire_in: 30 days
    paths:
      - apps/desktop/release/

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
