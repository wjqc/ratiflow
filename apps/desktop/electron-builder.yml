appId: local.ratiflow.desktop
productName: Ratiflow
directories:
  output: release
  buildResources: build
files:
  - dist/**
extraResources:
  - from: ../../target/release/ratiflow-core
    to: ratiflow-core
mac:
  category: public.app-category.developer-tools
  target:
    - dir
    - dmg
  icon: icon.icns
dmg:
  artifactName: Ratiflow-${version}-${arch}.dmg
win:
  icon: icon.ico
linux:
  icon: icon.png
